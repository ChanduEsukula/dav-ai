# Local verification only. Production publication remains unauthorized.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DAVAI_ENV: local
      DAV_AI_PHARMA_RELEASE_DB: /data/pharma/pharma.sqlite
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./data/releases/dav_ai_pharma_v1/phase4b-communications-2026-10-06/pharma.sqlite:/data/pharma/pharma.sqlite:ro
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
