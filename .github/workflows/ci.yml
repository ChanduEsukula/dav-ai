name: Dav AI CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  runtime-lock:
    name: Clean hash-locked runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r backend/requirements-runtime.lock
      - run: PYTHONPATH=backend python -c 'import sys; from app.main import app; assert "psycopg" not in sys.modules; assert "httpx" not in sys.modules'

  backend-tests:
    name: Artifact-independent runtime and offline regressions
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PHARMA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r backend/requirements-dev.txt
          python -m pip check

      - name: Check Python syntax and runtime imports
        run: |
          python -m compileall -q backend/app scripts/pharma_release
          PYTHONPATH=backend python -c 'from app.main import app; assert len(app.openapi()["paths"]) == 11'

      - name: Run backend tests
        run: PYTHONPATH=backend python -m pytest backend/tests -m "not release_artifact" -ra

  frontend-build:
    name: Frontend lint, test, build, and E2E
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Run frontend build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E smoke test
        run: npm run test:e2e
